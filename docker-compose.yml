services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASS}@db:5432/binggge
    depends_on: [db]
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: binggge
      POSTGRES_PASSWORD: ${DB_PASS}
    # Volume nomme uniquement : le serveur interdit les montages de dossiers de l'hote
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
