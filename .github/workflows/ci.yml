# Pipeline : test -> build -> deploy (equivalent GitHub Actions du .gitlab-ci.yml du cours)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: binggge
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/binggge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Applique le schema
        run: PGPASSWORD=test psql -h localhost -U postgres binggge < api/db/schema.sql
      - name: Installe et teste
        run: cd api && npm ci && npm test
