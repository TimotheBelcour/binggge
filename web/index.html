<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>binggge — suivi de séries</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<style>
  :root {
    --fond: #101117;
    --carte: #1a1c24;
    --carte-survol: #20232d;
    --bord: #2b2e3a;
    --texte: #eceef3;
    --doux: #969db0;
    --accent: #e8bc4e;
    --accent-sombre: #c79c33;
    --danger: #f0a0a0;
    --rayon: .7rem;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --fond: #f7f7f9;
      --carte: #ffffff;
      --carte-survol: #f0f1f4;
      --bord: #e0e2e8;
      --texte: #1b1d23;
      --doux: #656c7d;
      --accent: #c79c33;
      --accent-sombre: #a5801f;
      --danger: #b02a2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2.5rem 1rem 5rem;
    background: var(--fond);
    color: var(--texte);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 48rem; margin: 0 auto; }

  h1 { font-size: 2.1rem; margin: 0; letter-spacing: -.03em; }
  h1 span { color: var(--accent); }
  .sous-titre { color: var(--doux); margin: .2rem 0 2.2rem; }
  h2 {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--doux); margin: 2.4rem 0 .8rem; font-weight: 600;
  }

  input, button { font: inherit; }
  input[type="text"], input:not([type]) {
    padding: .65rem .85rem;
    background: var(--carte);
    border: 1px solid var(--bord);
    border-radius: var(--rayon);
    color: var(--texte);
    transition: border-color .15s;
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  input[type="checkbox"] { accent-color: var(--accent); width: 1rem; height: 1rem; cursor: pointer; }

  button {
    padding: .65rem .95rem;
    background: var(--accent);
    border: 1px solid transparent;
    border-radius: var(--rayon);
    color: #17181d;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  button:hover:not(:disabled) { background: var(--accent-sombre); }
  button.discret {
    background: transparent; border-color: var(--bord);
    color: var(--doux); font-weight: 500;
  }
  button.discret:hover:not(:disabled) { background: var(--carte-survol); color: var(--texte); }
  button:disabled { opacity: .45; cursor: default; }

  form { display: flex; gap: .5rem; flex-wrap: wrap; }
  form input { flex: 1; min-width: 11rem; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
  li {
    display: flex; align-items: center; gap: .85rem;
    padding: .7rem;
    background: var(--carte);
    border: 1px solid var(--bord);
    border-radius: var(--rayon);
    transition: background .15s;
  }
  li:hover { background: var(--carte-survol); }
  .affiche {
    width: 44px; height: 62px; flex: none;
    object-fit: cover; border-radius: .35rem;
    background: var(--bord);
  }
  .affiche.vide { background: var(--bord); }
  .titre { flex: 1; min-width: 0; }
  .titre b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .titre span { color: var(--doux); font-size: .85rem; }
  li.vue .titre b { color: var(--doux); text-decoration: line-through; }

  li.serie { flex-wrap: wrap; align-items: flex-start; }
  li.serie .haut {
    display: flex; align-items: center; gap: .85rem;
    width: 100%; min-width: 0; flex-wrap: wrap;
  }
  .chevron {
    background: transparent; border: 0; color: var(--doux);
    /* 44px de cible : la taille d'un bout de doigt */
    min-width: 2.75rem; min-height: 2.75rem;
    display: flex; align-items: center; justify-content: center;
    line-height: 1; cursor: pointer; flex: none;
  }
  button.chevron:hover { color: var(--texte); background: transparent; }
  .chevron span { display: block; transition: transform .2s; }
  li.ouverte .chevron span { transform: rotate(90deg); }

  .depliable { cursor: pointer; }

  .section-terminees { margin-top: 1.4rem; }
  .replier {
    display: flex; align-items: center; gap: .5rem;
    width: 100%; padding: .55rem .2rem;
    background: transparent; border: 0; border-top: 1px solid var(--bord);
    border-radius: 0; color: var(--doux);
    font-size: .8rem; text-transform: uppercase; letter-spacing: .07em;
  }
  /* button:hover:not(:disabled) est plus specifique que .replier:hover :
     on nomme l'element pour reprendre la main */
  button.replier:hover { background: transparent; color: var(--texte); }
  .chevron-inline { display: inline-block; transition: transform .2s; }
  .chevron-inline.ouvert { transform: rotate(90deg); }
  .section-terminees ul { margin-top: .5rem; }
  .progression { color: var(--doux); font-size: .85rem; }
  .prochain { color: var(--texte); }
  li.vue .prochain { color: var(--doux); }
  .barre {
    width: 100%; height: 3px; margin-top: .55rem;
    background: var(--bord); border-radius: 2px; overflow: hidden;
  }
  .barre i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

  .episodes { width: 100%; margin-top: .7rem; padding-top: .7rem; border-top: 1px solid var(--bord); }
  .episodes h3 {
    margin: .9rem 0 .35rem; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .07em; color: var(--doux); font-weight: 600;
  }
  .episodes h3:first-child { margin-top: 0; }
  .episodes label {
    display: flex; align-items: center; gap: .6rem;
    padding: .25rem .3rem; border-radius: .35rem;
    font-size: .92rem; cursor: pointer; min-width: 0;
  }
  .episodes label span {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .episodes label input { flex: none; }
  .episodes label:hover { background: var(--fond); }
  .episodes label.vu span { color: var(--doux); text-decoration: line-through; }
  .episodes code { color: var(--doux); font-size: .78rem; flex: none; }

  .barre-titre {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; margin: 2.4rem 0 .8rem;
  }
  .barre-titre h2 { margin: 0; }
  .panneau {
    padding: .9rem;
    background: var(--carte);
    border: 1px solid var(--bord);
    border-radius: var(--rayon);
    margin-bottom: 1rem;
  }
  .panneau ul { margin-top: .7rem; }
  .panneau li { background: var(--fond); }

  .fiche { font-size: .9rem; color: var(--doux); margin: 0 0 .2rem; }
  .fiche .note { color: var(--accent); font-weight: 600; }
  .synopsis {
    margin: .5rem 0 1.1rem; font-size: .92rem; color: var(--doux);
    max-width: 44rem;
  }
  /* Sans synopsis, la fiche seule doit garder cet ecart avec les saisons */
  .fiche:last-of-type { margin-bottom: 1.1rem; }

  /* L'emplacement est toujours reserve : l'apparition du message ne doit pas
     decaler la liste sous le curseur de l'utilisateur */
  .zone-message { min-height: 2.6rem; }
  .message {
    margin: 0 0 .7rem; padding: .5rem .7rem;
    background: var(--carte); border: 1px solid var(--bord);
    border-left: 3px solid var(--accent); border-radius: .4rem;
    font-size: .9rem; color: var(--doux);
  }
  .vide { color: var(--doux); font-style: italic; margin: .4rem 0; }
  .erreur { color: var(--danger); margin: .4rem 0; }

  header.moi { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.8rem; }
  header.moi span { color: var(--doux); font-size: .92rem; }

  /* Squelettes affiches pendant le chargement */
  .squelette {
    background: linear-gradient(90deg, var(--bord) 25%, var(--carte-survol) 50%, var(--bord) 75%);
    background-size: 200% 100%;
    animation: glisse 1.2s infinite;
  }
  @keyframes glisse { to { background-position: -200% 0; } }
  /* Sur petit ecran, les actions passent sous le titre plutot que de
     pousser la ligne hors de l'ecran */
  @media (max-width: 34rem) {
    body { padding: 1.5rem .75rem 4rem; }
    li.serie .haut > button.discret { flex: 1; }
    li.serie .titre { flex-basis: 100%; order: -1; }
    li.serie .chevron { order: -2; }
    .affiche { order: -2; }
  }

  @media (prefers-reduced-motion: reduce) {
    .squelette { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="racine"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.umd.js"></script>
<script>
const { useState, useEffect, useCallback } = React;
const html = htm.bind(React.createElement);

// L'API est servie par le meme serveur que cette page : on deduit la base de l'URL courante,
// ce qui fonctionne aussi bien en local qu'en ligne derriere un prefixe (/<pseudo>/).
const BASE = location.pathname.replace(/\/[^/]*$/, "");

async function api(chemin, options = {}) {
  const login = localStorage.getItem("binggge_login");
  const reponse = await fetch(BASE + chemin, {
    ...options,
    headers: {
      "content-type": "application/json",
      ...(login ? { "X-User": login } : {}),
      ...options.headers,
    },
  });
  if (!reponse.ok) {
    const corps = await reponse.json().catch(() => ({}));
    const erreur = new Error(corps.error || `erreur ${reponse.status}`);
    // Le code HTTP porte le sens, pas le texte du message : l'appelant s'y fie
    erreur.status = reponse.status;
    throw erreur;
  }
  return reponse.status === 204 ? null : reponse.json();
}

// Les fiches TVMaze ne changent pas d'une seconde a l'autre : on les garde
// en memoire pour ne pas les redemander a chaque rendu
const fiches = new Map();

// S01E02 : le meme format dans la liste et dans les episodes deplies
function code(episode) {
  return `S${String(episode.season).padStart(2, "0")}E${String(episode.number).padStart(2, "0")}`;
}

function useFiche(showId) {
  const [fiche, setFiche] = useState(() => fiches.get(showId) || null);

  useEffect(() => {
    if (fiches.has(showId)) {
      setFiche(fiches.get(showId));
      return;
    }
    let vivant = true;
    api(`/shows/${showId}`)
      .then((f) => {
        fiches.set(showId, f);
        // Le composant peut avoir disparu entre-temps (serie retiree)
        if (vivant) setFiche(f);
      })
      .catch(() => {});
    return () => {
      vivant = false;
    };
  }, [showId]);

  return fiche;
}

function Connexion({ onConnecte }) {
  const [login, setLogin] = useState("");
  const [erreur, setErreur] = useState(null);
  const [envoi, setEnvoi] = useState(false);

  async function entrer(e) {
    e.preventDefault();
    const nom = login.trim();
    if (!nom) return;
    setEnvoi(true);
    setErreur(null);
    try {
      await api("/register", { method: "POST", body: JSON.stringify({ login: nom }) });
    } catch (err) {
      // 409 : le login existe deja, on se reconnecte simplement dessus
      if (err.status !== 409) {
        setErreur(err.message);
        setEnvoi(false);
        return;
      }
    }
    localStorage.setItem("binggge_login", nom);
    onConnecte(nom);
  }

  return html`
    <form onSubmit=${entrer}>
      <input value=${login} onInput=${(e) => setLogin(e.target.value)}
             placeholder="Votre login" aria-label="Votre login" />
      <button type="submit" disabled=${envoi || !login.trim()}>
        ${envoi ? "…" : "Entrer"}
      </button>
      ${erreur && html`<p class="erreur">${erreur}</p>`}
    </form>
  `;
}

function Recherche({ onAjout, onAjoutTermine, dejaDansLaListe }) {
  const [q, setQ] = useState("");
  const [resultats, setResultats] = useState(null);
  const [cherche, setCherche] = useState(false);
  const [erreur, setErreur] = useState(null);
  const [enCours, setEnCours] = useState(null);

  async function chercher(e) {
    e.preventDefault();
    if (!q.trim()) return;
    setCherche(true);
    setErreur(null);
    try {
      setResultats(await api(`/shows?q=${encodeURIComponent(q)}`));
    } catch (err) {
      setErreur(err.message);
      setResultats(null);
    } finally {
      setCherche(false);
    }
  }

  async function ajouter(serie) {
    setEnCours(serie.id);
    try {
      await onAjout(serie);
      // Le panneau se referme : la serie ajoutee est deja visible dans la liste
      onAjoutTermine();
    } finally {
      setEnCours(null);
    }
  }

  return html`
    <form onSubmit=${chercher}>
      <input value=${q} onInput=${(e) => setQ(e.target.value)}
             placeholder="Chercher une série…" aria-label="Chercher une série"
             ref=${(el) => el && el.focus()} />
      <button type="submit" disabled=${cherche || !q.trim()}>
        ${cherche ? "…" : "Chercher"}
      </button>
    </form>
    ${erreur && html`<p class="erreur">${erreur}</p>`}
    ${cherche && html`
      <ul aria-busy="true">
        ${[0, 1, 2].map((i) => html`
          <li key=${i}>
            <div class="affiche squelette"></div>
            <div class="titre"><b>&nbsp;</b><span>Recherche en cours…</span></div>
          </li>
        `)}
      </ul>
    `}
    ${!cherche && resultats && resultats.length === 0 && html`
      <p class="vide">Aucune série ne correspond à « ${q} ».</p>
    `}
    ${!cherche && resultats && resultats.length > 0 && html`
      <ul>
        ${resultats.slice(0, 8).map((s) => {
          const deja = dejaDansLaListe(s.id);
          return html`
            <li key=${s.id}>
              ${s.image
                ? html`<img class="affiche" src=${s.image} alt="" loading="lazy" />`
                : html`<div class="affiche vide"></div>`}
              <div class="titre"><b>${s.title}</b><span>${s.year || "année inconnue"}</span></div>
              <button disabled=${deja || enCours === s.id}
                      onClick=${() => ajouter(s)}>
                ${deja ? "Déjà ajoutée" : enCours === s.id ? "…" : "Ajouter"}
              </button>
            </li>
          `;
        })}
      </ul>
    `}
  `;
}

function Episodes({ serie, version, onChangement }) {
  const [episodes, setEpisodes] = useState(null);
  const [erreur, setErreur] = useState(null);
  const fiche = useFiche(serie.show_id);

  useEffect(() => {
    api(`/watchlist/${serie.id}/episodes`)
      .then(setEpisodes)
      .catch((err) => setErreur(err.message));
    // `version` change quand on coche tout d'un coup : la liste depliee
    // doit alors etre relue, sinon elle affiche un etat perime
  }, [serie.id, version]);

  async function basculer(episode) {
    // On met a jour l'affichage tout de suite, le serveur suit
    setEpisodes((liste) =>
      liste.map((e) => (e.id === episode.id ? { ...e, seen: !e.seen } : e))
    );
    await api(`/watchlist/${serie.id}/episodes/${episode.id}`, {
      method: "PUT",
      body: JSON.stringify({ seen: !episode.seen }),
    });
    onChangement();
  }

  if (erreur) return html`<div class="episodes"><p class="erreur">${erreur}</p></div>`;
  if (!episodes) return html`<div class="episodes"><p class="vide">Chargement…</p></div>`;

  const saisons = [...new Set(episodes.map((e) => e.season))];

  return html`
    <div class="episodes">
      ${fiche && html`
        <p class="fiche">
          ${fiche.year || "année inconnue"}
          ${fiche.genres.length > 0 && ` · ${fiche.genres.join(", ")}`}
          ${fiche.status && ` · ${fiche.status === "Ended" ? "terminée" : "en cours"}`}
          ${fiche.rating && html` · <span class="note">${fiche.rating}/10</span>`}
        </p>
      `}
      ${fiche && fiche.summary && html`<p class="synopsis">${fiche.summary}</p>`}
      ${saisons.map((saison) => html`
        <div key=${saison}>
          <h3>Saison ${saison}</h3>
          ${episodes.filter((e) => e.season === saison).map((e) => html`
            <label key=${e.id} class=${e.seen ? "vu" : ""}>
              <input type="checkbox" checked=${e.seen} onChange=${() => basculer(e)} />
              <code>${code(e)}</code>
              <span>${e.name}</span>
            </label>
          `)}
        </div>
      `)}
    </div>
  `;
}

function Serie({ serie, version, onBascule, onRetrait, onReprise, onChangement }) {
  const [ouverte, setOuverte] = useState(false);
  const [occupee, setOccupee] = useState(false);
  const fiche = useFiche(serie.show_id);
  const total = serie.total;
  const pourcent = total > 0 ? (serie.vus / total) * 100 : 0;

  async function action(faire) {
    setOccupee(true);
    try {
      await faire();
    } finally {
      setOccupee(false);
    }
  }

  const progression = total
    ? `${serie.vus}/${total} épisodes`
    : serie.vus > 0
      ? `${serie.vus} épisode${serie.vus > 1 ? "s" : ""} vu${serie.vus > 1 ? "s" : ""}`
      : fiche && fiche.genres.length > 0
        ? fiche.genres.slice(0, 2).join(" · ")
        : null;

  const prochain = serie.next
    ? `${code(serie.next)} · ${serie.next.name}`
    : serie.seen
      ? "Terminée"
      : null;

  // Les boutons d'action vivent dans la carte cliquable : sans ce garde,
  // cliquer « Retirer » deplierait aussi la serie
  function basculerOuverture(e) {
    if (e.target.closest("button, a, input, label")) return;
    setOuverte(!ouverte);
  }

  return html`
    <li class=${`serie ${serie.seen ? "vue" : ""} ${ouverte ? "ouverte" : ""}`}>
      <div class="haut depliable" onClick=${basculerOuverture}>
        <button class="chevron" onClick=${() => setOuverte(!ouverte)}
                aria-expanded=${ouverte}
                aria-label=${`${ouverte ? "Replier" : "Déplier"} les épisodes de ${serie.title}`}>
          <span aria-hidden="true">▸</span>
        </button>
        ${fiche && fiche.image
          ? html`<img class="affiche" src=${fiche.image} alt="" loading="lazy" />`
          : html`<div class=${`affiche ${fiche ? "vide" : "squelette"}`}></div>`}
        <div class="titre">
          <b>${serie.title}</b>
          <span class="progression">
            ${progression}
            ${progression && prochain && " · "}
            ${prochain && html`<span class="prochain">${prochain}</span>`}
          </span>
        </div>
        ${!serie.seen && html`
          <button disabled=${occupee} onClick=${() => action(() => onReprise(serie))}>
            ${occupee ? "…" : "Reprendre"}
          </button>
        `}
        <button class="discret" disabled=${occupee}
                onClick=${() => action(() => onBascule(serie))}>
          ${serie.seen ? "Tout décocher" : "Tout cocher"}
        </button>
        <button class="discret" disabled=${occupee}
                onClick=${() => action(() => onRetrait(serie))}>Retirer</button>
      </div>
      ${total > 0 && html`<div class="barre"><i style=${{ width: `${pourcent}%` }}></i></div>`}
      ${ouverte && html`<${Episodes} serie=${serie} version=${version} onChangement=${onChangement} />`}
    </li>
  `;
}

function Liste({ series, version, onBascule, onRetrait, onReprise, onChangement }) {
  const [terminéesVisibles, setTerminéesVisibles] = useState(false);

  if (series.length === 0) {
    return html`<p class="vide">Rien pour l'instant. Cliquez sur « Ajouter une série » pour commencer.</p>`;
  }

  const enCours = series.filter((s) => !s.seen);
  const terminees = series.filter((s) => s.seen);

  const cartes = (liste) => html`
    <ul>
      ${liste.map((s) => html`
        <${Serie} key=${s.id} serie=${s} version=${version} onBascule=${onBascule}
                  onRetrait=${onRetrait} onReprise=${onReprise} onChangement=${onChangement} />
      `)}
    </ul>
  `;

  return html`
    ${enCours.length > 0 && cartes(enCours)}
    ${enCours.length === 0 && html`
      <p class="vide">Tout est à jour : aucune série en cours.</p>
    `}
    ${terminees.length > 0 && html`
      <div class="section-terminees">
        <button class="replier" onClick=${() => setTerminéesVisibles(!terminéesVisibles)}
                aria-expanded=${terminéesVisibles}>
          <span class="chevron-inline ${terminéesVisibles ? "ouvert" : ""}" aria-hidden="true">▸</span>
          Terminées (${terminees.length})
        </button>
        ${terminéesVisibles && cartes(terminees)}
      </div>
    `}
  `;
}

function App() {
  const [login, setLogin] = useState(() => localStorage.getItem("binggge_login"));
  const [series, setSeries] = useState([]);
  const [erreur, setErreur] = useState(null);
  // Incremente par les actions qui touchent plusieurs episodes a la fois
  const [version, setVersion] = useState(0);
  const [rechercheOuverte, setRechercheOuverte] = useState(false);
  const [message, setMessage] = useState(null);

  const recharger = useCallback(async () => {
    try {
      setSeries(await api("/watchlist"));
      setErreur(null);
    } catch (err) {
      setErreur(err.message);
    }
  }, []);

  useEffect(() => { if (login) recharger(); }, [login, recharger]);

  useEffect(() => {
    if (!message) return;
    const minuteur = setTimeout(() => setMessage(null), 4000);
    return () => clearTimeout(minuteur);
  }, [message]);

  async function ajouter(serie) {
    await api("/watchlist", {
      method: "POST",
      body: JSON.stringify({ show_id: serie.id, title: serie.title }),
    });
    await recharger();
  }

  async function basculer(serie) {
    await api(`/watchlist/${serie.id}`, {
      method: "PATCH",
      body: JSON.stringify({ seen: !serie.seen }),
    });
    setVersion((v) => v + 1);
    recharger();
  }

  async function reprendre(serie) {
    try {
      const episode = await api(`/watchlist/${serie.id}/episodes/next`, { method: "POST" });
      setMessage(`${code(episode)} · ${episode.name} marqué vu`);
    } catch (err) {
      setMessage(err.message);
    }
    // La liste depliee doit refleter le nouvel episode coche
    setVersion((v) => v + 1);
    recharger();
  }

  async function retirer(serie) {
    await api(`/watchlist/${serie.id}`, { method: "DELETE" });
    recharger();
  }

  function ajoutTermine() {
    setRechercheOuverte(false);
  }

  function sortir() {
    localStorage.removeItem("binggge_login");
    setLogin(null);
    setSeries([]);
  }

  return html`
    <main>
      <h1>bin<span>ggg</span>e</h1>
      <p class="sous-titre">Suivez vos séries, épisode par épisode.</p>
      ${!login
        ? html`<${Connexion} onConnecte=${setLogin} />`
        : html`
            <header class="moi">
              <span>Connecté comme <b>${login}</b></span>
              <button class="discret" onClick=${sortir}>Changer</button>
            </header>
            <div class="barre-titre">
              <h2>Ma liste</h2>
              <button onClick=${() => setRechercheOuverte(!rechercheOuverte)}
                      aria-expanded=${rechercheOuverte}>
                ${rechercheOuverte ? "Fermer" : "Ajouter une série"}
              </button>
            </div>
            ${rechercheOuverte && html`
              <div class="panneau">
                <${Recherche} onAjout=${ajouter} onAjoutTermine=${ajoutTermine}
                              dejaDansLaListe=${(showId) => series.some((s) => s.show_id === showId)} />
              </div>
            `}
            ${erreur && html`<p class="erreur">${erreur}</p>`}
            <div class="zone-message">
              ${message && html`<p class="message" role="status">${message}</p>`}
            </div>
            <${Liste} series=${series} version=${version} onBascule=${basculer}
                      onRetrait=${retirer} onReprise=${reprendre} onChangement=${recharger} />
          `}
    </main>
  `;
}

ReactDOM.createRoot(document.getElementById("racine")).render(html`<${App} />`);
</script>
</body>
</html>
